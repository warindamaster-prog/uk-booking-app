# Calls /api/health every 3 days so the Supabase Free project is never idle for a week (idle projects
# are paused). If the site or database is down the run fails and GitHub emails the repository owner.
# Uses the APP_URL repository secret (the same one the reminders workflow uses).
name: keepalive
on:
  schedule: [{ cron: "17 6 */3 * *" }]
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Call the health check
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then echo "Set the APP_URL repository secret"; exit 1; fi
          curl -fsS --retry 3 --retry-delay 10 --max-time 30 "$APP_URL/api/health"
